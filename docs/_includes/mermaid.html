<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
  window.addEventListener("load", async function () {
    mermaid.initialize({
      startOnLoad: false,
      theme: "dark",
      themeVariables: {
        darkMode: true,
        background: "#1a1a2e",
        primaryColor: "#4a9eff",
        primaryTextColor: "#e0e0e0",
        lineColor: "#6b7280",
      },
    });
    await mermaid.run({
      querySelector: ".language-mermaid",
    });
  });
</script>
